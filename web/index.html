<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Plugin Manager</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --panel2: #1c222e; --line: #2a3140;
    --text: #e6e9f0; --muted: #8b93a5; --accent: #4f8cff; --ok: #34c759;
    --warn: #ff9f0a; --danger: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root.light { --bg: #f5f6f8; --panel: #ffffff; --panel2: #eef0f4; --line: #d9dce3; --text: #1c2129; --muted: #6b7280; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .spacer { flex: 1; }
  select, input, button { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .main { flex: 1; display: flex; min-height: 0; }
  .list { width: 320px; border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:hover { background: var(--panel2); }
  .list-item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--muted); }
  .dot.install { background: var(--warn); }
  .list-item .id { font-weight: 500; }
  .list-item .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .src { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--panel2); color: var(--muted); flex: none; }
  .detail { flex: 1; padding: 20px 24px; overflow-y: auto; }
  .detail h2 { font-size: 18px; margin-bottom: 4px; }
  .detail .sub { color: var(--muted); margin-bottom: 16px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin-bottom: 16px; }
  .kv dt { color: var(--muted); }
  .kv dd { word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .list-item.dragging { opacity: 0.5; }
  .list-item.drag-over { border-top: 2px solid var(--accent); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <h1>🧩 DSH Plugin Manager</h1>
  <label>profile</label>
  <select id="profile"></select>
  <button onclick="loadProfiles()">刷新</button>
  <span id="dshStatus" class="dot off" title="dsh web 状态"></span>
  <button id="startBtn" onclick="startDsh()">启动 dsh</button>
  <button id="stopBtn" onclick="stopDsh()">停止 dsh</button>
  <div class="spacer"></div>
  <input id="searchInput" placeholder="搜索…" style="width: 140px" oninput="renderList()">
  <button onclick="exportProfile()">导出</button>
  <button onclick="toggleTheme()" id="themeBtn">🌙</button>
  <input id="installInput" placeholder="npm 包名…" style="width: 200px">
  <button class="primary" onclick="installPlugin()">安装</button>
</header>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">选择一个插件查看详情</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
let currentProfile = null;
let plugins = [];

// Desktop mode: call Tauri commands; fallback to HTTP when running as webui.
const invoke = window.__TAURI__?.core?.invoke || null;
async function api(path, opts) {
  if (invoke) {
    const [name, query] = path.split("?");
    const qs = new URLSearchParams(query || "");
    const body = opts && opts.body ? JSON.parse(opts.body) : {};
    switch (name) {
      case "/api/profiles": { const p = await invoke("list_profiles"); return { profiles: p, current: p[0] || null }; }
      case "/api/plugins": return await invoke("list_plugins", { profile: qs.get("profile") }).then((p) => ({ profile: qs.get("profile"), plugins: p }));
      case "/api/export": return await invoke("export_profile", { profile: qs.get("profile") });
      case "/api/toggle": return await invoke("set_plugin_disabled", body);
      case "/api/bundle": return await invoke("set_bundle", body);
      case "/api/reorder": return await invoke("set_bundle_order", body);
      case "/api/install": return await invoke("install_plugin", body);
      case "/api/dsh-status": return await invoke("dsh_status");
      case "/api/dsh-start": return await invoke("start_dsh", body);
      case "/api/dsh-stop": return await invoke("stop_dsh");
      case "/api/profile-info": return await invoke("profile_info", { profile: qs.get("profile") });
      case "/api/config": return await invoke("set_plugin_config", body);
    }
    throw new Error("unknown api " + name);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => (el.style.display = "none"), 2500);
}
async function loadProfiles() {
  try {
    const data = await api("/api/profiles");
    const sel = document.getElementById("profile");
    sel.innerHTML = "";
    for (const p of data.profiles) {
      const opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    }
    if (data.current) sel.value = data.current;
    currentProfile = sel.value;
    await loadPlugins();
  } catch (e) { toast("加载失败: " + e.message); }
}
async function refreshDshStatus() {
  try {
    const s = await api("/api/dsh-status");
    const el = document.getElementById("dshStatus");
    el.className = "dot " + (s.running ? "on" : "off");
    el.title = s.running ? "dsh web 运行中 (port " + s.port + ")" : "dsh web 未运行";
  } catch {}
}
async function startDsh() {
  try {
    const r = await api("/api/dsh-start", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile }) });
    toast(r.ok ? "已启动 dsh web（" + currentProfile + "）" : "启动失败: " + (r.error || ""));
    setTimeout(refreshDshStatus, 2000);
  } catch (e) { toast("启动失败: " + e.message); }
}
async function stopDsh() {
  if (!confirm("确定停止 dsh web？")) return;
  try {
    const r = await api("/api/dsh-stop", { method: "POST" });
    toast(r.ok ? "已停止 dsh web" : "停止失败");
    setTimeout(refreshDshStatus, 1500);
  } catch (e) { toast("停止失败: " + e.message); }
}
async function saveConfig(id) {
  const ta = document.getElementById("configEditor");
  let value;
  try { value = ta.value.trim() ? JSON.parse(ta.value) : null; }
  catch { return toast("config 不是合法 JSON"); }
  try {
    await api("/api/config", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, id, config: value }) });
    toast("已保存 " + id + " 的 config");
    await loadPlugins();
  } catch (e) { toast("保存失败: " + e.message); }
}
async function loadPlugins() {
  currentProfile = document.getElementById("profile").value;
  const data = await api("/api/plugins?profile=" + encodeURIComponent(currentProfile));
  plugins = data.plugins;
  renderList();
  if (plugins.length) selectPlugin(plugins[0].id); else document.getElementById("detail").innerHTML = '<div class="empty">无插件</div>';
}
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const filtered = q ? plugins.filter((p) => (p.id + " " + (p.name || "") + " " + (p.description || "")).toLowerCase().includes(q)) : plugins;
  for (const p of filtered) {
    const row = document.createElement("div");
    row.className = "list-item" + (document.querySelector(".list-item.active")?.dataset?.id === p.id ? " active" : "");
    row.dataset.id = p.id;
    row.draggable = p.kind === "bundle";
    row.onclick = () => selectPlugin(p.id);
    row.ondragstart = (e) => { e.dataTransfer.setData("text/plain", p.name); row.classList.add("dragging"); };
    row.ondragover = (e) => { if (p.kind === "bundle") { e.preventDefault(); row.classList.add("drag-over"); } };
    row.ondragleave = () => row.classList.remove("drag-over");
    row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drag-over"); reorderBundles(e.dataTransfer.getData("text/plain"), p.name); };
    const dot = document.createElement("span");
    dot.className = "dot " + (p.disabled ? "off" : p.kind === "bundle" ? "on" : "on");
    const id = document.createElement("span");
    id.className = "id"; id.textContent = p.id;
    const src = document.createElement("span");
    src.className = "src"; src.textContent = p.kind === "bundle" ? "bundle" : "patch";
    const meta = document.createElement("span");
    meta.className = "meta"; meta.textContent = p.disabled ? "已禁用" : "已启用";
    row.append(dot, id, meta, src);
    list.appendChild(row);
  }
}
async function selectPlugin(id) {
  const p = plugins.find((x) => x.id === id);
  if (!p) return;
  document.querySelectorAll(".list-item").forEach((r) => r.classList.toggle("active", r.dataset.id === id));
  const d = document.getElementById("detail");
  d.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = p.id; d.appendChild(h);
  const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = p.description || p.name || ""; d.appendChild(sub);
  const kv = document.createElement("dl"); kv.className = "kv";
  const rows = [
    ["来源", p.kind === "bundle" ? "bundle（dsh.profile.bundles）" : "patch（cordis.patch.yml）"],
    ["名称", p.name],
    ["版本", p.version || "—"],
    ["状态", p.disabled ? "已禁用" : "已启用"],
  ];
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    kv.append(dt, dd);
  }
  d.appendChild(kv);
  const cdt = document.createElement("dt"); cdt.textContent = "config";
  const cdd = document.createElement("dd");
  cdd.style.display = "flex"; cdd.style.flexDirection = "column"; cdd.style.gap = "6px";
  const ta = document.createElement("textarea");
  ta.id = "configEditor"; ta.rows = 4; ta.style.font = "12px monospace"; ta.style.width = "100%"; ta.style.boxSizing = "border-box";
  ta.value = p.config ? JSON.stringify(p.config, null, 2) : "";
  ta.placeholder = "插件 config（JSON，留空表示无）";
  const save = document.createElement("button");
  save.textContent = "保存 config";
  save.onclick = () => saveConfig(p.id);
  cdd.append(ta, save);
  kv.append(cdt, cdd);
  const actions = document.createElement("div"); actions.className = "actions";
  if (!p.disabled) {
    const b = document.createElement("button");
    b.textContent = "禁用";
    b.onclick = async () => { await api("/api/toggle", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, id: p.id, disabled: true }) }); toast("已禁用 " + p.id); await loadPlugins(); };
    actions.appendChild(b);
  } else {
    const b = document.createElement("button"); b.className = "primary";
    b.textContent = "启用";
    b.onclick = async () => { await api("/api/toggle", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, id: p.id, disabled: false }) }); toast("已启用 " + p.id); await loadPlugins(); };
    actions.appendChild(b);
  }
  if (p.kind === "bundle") {
    const r = document.createElement("button");
    r.textContent = "从 bundles 移除";
    r.onclick = async () => { await api("/api/bundle", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, name: p.name, enabled: false }) }); toast("已移除 bundle " + p.name); await loadPlugins(); };
    actions.appendChild(r);
  }
  d.appendChild(actions);
}
async function reorderBundles(from, to) {
  if (!from || !to || from === to) return;
  const names = plugins.filter((p) => p.kind === "bundle").map((p) => p.name);
  const i = names.indexOf(from), j = names.indexOf(to);
  if (i < 0 || j < 0) return;
  names.splice(i, 1); names.splice(j, 0, from);
  try {
    await api("/api/reorder", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, bundles: names }) });
    toast("bundle 顺序已更新");
    await loadPlugins();
  } catch (e) { toast("排序失败: " + e.message); }
}
async function exportProfile() {
  try {
    const data = await api("/api/export?profile=" + encodeURIComponent(currentProfile));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dsh-profile-" + currentProfile + "-plugins.json";
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { toast("导出失败: " + e.message); }
}
function toggleTheme() {
  const root = document.documentElement;
  const light = root.classList.toggle("light");
  document.getElementById("themeBtn").textContent = light ? "☀️" : "🌙";
}
async function installPlugin() {
  const input = document.getElementById("installInput");
  const pkg = input.value.trim();
  if (!pkg) return toast("输入包名");
  try {
    const r = await api("/api/install", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, package: pkg }) });
    toast(r.ok ? "安装成功（重启 dsh 生效）" : "安装失败: " + r.output);
    input.value = "";
    await loadPlugins();
  } catch (e) { toast("安装失败: " + e.message); }
}
document.getElementById("profile").addEventListener("change", () => { loadPlugins(); refreshDshStatus(); });
loadProfiles();
refreshDshStatus();
setInterval(refreshDshStatus, 10000);
</script>
</body>
</html>
