<!DOCTYPE html>

<meta charset="utf-8">

<div class="app">

    <button class="btn sm" onclick="checkUpdates()" title="检查更新" aria-label="check updates"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A5.5 5.5 0 1 1 2 10"/><path d="M2 3v3.5h3.5"/></svg></button>
    <button class="btn sm" onclick="toggleTheme()" id="themeBtn" title="主题" aria-label="theme"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg></button>
    <button class="btn sm" onclick="setLang(LANG==='zh'?'en':'zh')" id="langBtn">EN</button>
  </header>
  <div class="body">
    <div class="side">
      <div class="sw">
        <input id="searchInput" placeholder="搜索…" oninput="renderList()" spellcheck="false">
        <button class="sw-clear" id="searchClear" onclick="clearSearch()" aria-label="clear" style="display:none"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="detail" id="detail"><div class="empty" id="emptyHint"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const I18N = {
  zh: { enabled: "已启用", disabled: "已禁用", source: "来源", name: "名称", version: "版本", status: "状态", compat: "兼容", config: "config", enable: "启用", disable: "禁用", removeBundle: "移除", saveConfig: "保存 config", configPh: "插件 config（JSON，留空表示无）", empty: "选择插件查看详情", none: "无插件", running: "dsh web 运行中", stopped: "dsh web 未运行", readme: "README", profileFiles: "配置文件", pure: "纯净模式", startDsh: "启动 dsh", stopDsh: "停止", installPlugin: "装插件", save: "保存", search: "搜索", install: "安装", pureAskOn: "纯净模式：禁用所有第三方插件（保留 @deepseek-ai 官方）？", pureAskOff: "退出纯净模式：重新启用所有第三方插件？", pureOn: "纯净模式", pureOff: "已恢复", loading: "加载中…", noProfiles: "无 profile", noProfileHint: "未找到 profile（检查 ~/.dsh/profiles）", loadFailed: "加载失败", searchPh: "搜索 npm DSH 插件…", searching: "搜索中…", noResult: "无结果", saved: "已保存", startFailed: "启动失败", checkFailed: "检查失败", installOk: "已安装", installFail: "安装失败", stopConfirm: "停止 dsh web?" },
  en: { enabled: "enabled", disabled: "disabled", source: "Source", name: "Name", version: "Version", status: "Status", compat: "Compat", config: "config", enable: "Enable", disable: "Disable", removeBundle: "Remove", saveConfig: "Save config", configPh: "Plugin config (JSON, empty = none)", empty: "Select a plugin", none: "No plugins", running: "dsh web running", stopped: "dsh web stopped", readme: "README", profileFiles: "Profile files", pure: "Pure mode", startDsh: "Start dsh", stopDsh: "Stop", installPlugin: "Install", save: "Save", search: "Search", install: "Install", pureAskOn: "Pure mode: disable all third-party plugins (keep @deepseek-ai official)?", pureAskOff: "Exit pure mode: re-enable all third-party plugins?", pureOn: "Pure mode", pureOff: "Restored", loading: "Loading…", noProfiles: "No profiles", noProfileHint: "No profiles found (check ~/.dsh/profiles)", loadFailed: "Load failed", searchPh: "Search npm DSH plugins…", searching: "Searching…", noResult: "No results", saved: "Saved", startFailed: "Start failed", checkFailed: "Check failed", installOk: "Installed", installFail: "Install failed", stopConfirm: "Stop dsh web?" }
};
let LANG = localStorage.getItem("dpm-lang") || "zh";
const t = (k) => (I18N[LANG] || I18N.zh)[k] ?? k;
function setLang(l) {
  LANG = l; localStorage.setItem("dpm-lang", l);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.activeElement === document.getElementById("searchInput")) { clearSearch(); } });
applyLabels();
  renderList(); if (plugins.length) selectPlugin(plugins[0].id);
}
function emojiFor(id) {
  return { pureBtn: "🧹 ", startBtn: "▶ ", stopBtn: "⏹ ", installBtn: "🔍 ", profileFilesBtn: "📄 " }[id] || "";
}

const invoke = window.__TAURI__?.core?.invoke || null;
async function api(path, opts) {
  if (invoke) {
    const [name, query] = path.split("?");
    const qs = new URLSearchParams(query || "");
    const body = opts && opts.body ? JSON.parse(opts.body) : {};
    switch (name) {
      case "/api/profiles": { const p = await invoke("list_profiles"); return { profiles: p, current: p[0] || null }; }
      case "/api/plugins": return await invoke("list_plugins", { profile: qs.get("profile") }).then((p) => ({ profile: qs.get("profile"), plugins: p }));
      case "/api/export": return await invoke("export_profile", { profile: qs.get("profile") });
      case "/api/toggle": return await invoke("set_plugin_disabled", body);
      case "/api/bundle": return await invoke("set_bundle", body);
      case "/api/reorder": return await invoke("set_bundle_order", body);
      case "/api/install": return await invoke("install_plugin", body);
      case "/api/dsh-status": return await invoke("dsh_status");
      case "/api/dsh-start": return await invoke("start_dsh", body);
      case "/api/dsh-stop": return await invoke("stop_dsh");
      case "/api/profile-info": return await invoke("profile_info", { profile: qs.get("profile") });
      case "/api/config": return await invoke("set_plugin_config", body);
      case "/api/search": return await invoke("search_npm", { query: qs.get("q") || "" });
      case "/api/import": return await invoke("import_profile", body);
      case "/api/open-repo": return await invoke("open_plugin_repo", body);
      case "/api/updates": return await invoke("check_updates", { profile: qs.get("profile") });
      case "/api/purge": return await invoke("purge_third_party", body);
      case "/api/readme": return await invoke("read_plugin_readme", { profile: qs.get("profile"), name: qs.get("name") });
      case "/api/profile-files": return await invoke("read_profile_files", { profile: qs.get("profile") });
      case "/api/profile-files-save": return await invoke("write_profile_files", body);
    }
    throw new Error("unknown api " + name);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

let currentProfile = null, plugins = [], updates = {}, dshRunning = false, selectedId = null;

function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (type ? " t-" + type : "");
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; el.className = "toast"; }, 2600);
}

// Custom confirmation dialog (matches app style; no native browser confirm()).
function uiConfirm(message, { danger = false, okText = "确定", cancelText = "取消" } = {}) {
  return new Promise((resolve) => {
    const mask = document.createElement("div"); mask.className = "modal-mask";
    const modal = document.createElement("div"); modal.className = "confirm";
    const msg = document.createElement("div"); msg.className = "confirm-msg"; msg.textContent = message;
    const acts = document.createElement("div"); acts.className = "confirm-acts";
    const cancel = document.createElement("button"); cancel.className = "btn"; cancel.textContent = cancelText;
    const ok = document.createElement("button"); ok.className = "btn" + (danger ? " danger" : " primary"); ok.textContent = okText;
    const done = (v) => { mask.remove(); resolve(v); };
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    mask.onclick = (e) => { if (e.target === mask) done(false); };
    mask.addEventListener("keydown", (e) => { if (e.key === "Escape") done(false); if (e.key === "Enter") done(true); });
    acts.append(cancel, ok);
    modal.append(msg, acts);
    mask.append(modal);
    document.body.appendChild(mask);
    ok.focus();
  });
}

async function loadProfiles() {
  try {
    const data = await api("/api/profiles");
    const box = document.getElementById("profileItems");
    box.innerHTML = "";
    for (const p of data.profiles) {
      const it = document.createElement("div");
      it.className = "ri"; it.textContent = p.charAt(0).toUpperCase(); it.title = p;
      it.onclick = () => { currentProfile = p; selectedId = null; renderRail(); loadPlugins(); };
      box.appendChild(it);
    }
    if (!currentProfile) currentProfile = data.current || data.profiles[0];
    const pl = document.getElementById("profileLabel");
    if (pl) pl.textContent = currentProfile;
    renderRail();
    if (!data.profiles.length) {
      document.getElementById("list").innerHTML = '<div class="empty">无 profile</div>';
      document.getElementById("detail").innerHTML = '<div class="empty">未找到 profile（检查 ~/.dsh/profiles）</div>';
      return;
    }
    await loadPlugins();
  } catch (e) {
    document.getElementById("list").innerHTML = '<div class="empty">—</div>';
    document.getElementById("detail").innerHTML = '<div class="empty">加载失败</div>';
    toast("加载失败: " + e.message, "err");
  }
}
function renderRail() {
  document.querySelectorAll("#profileItems .ri").forEach((el) => el.classList.toggle("active", el.title === currentProfile));
  document.getElementById("dshDot").className = "dot" + (dshRunning ? " on" : "");
  document.getElementById("dshDot").title = dshRunning ? "dsh web 运行中" : "dsh web 未运行";
}
async function loadPlugins() {
  const listEl = document.getElementById("list");
  const detailEl = document.getElementById("detail");
  listEl.innerHTML = '<div class="empty muted">加载中…</div>';
  try {
    const data = await api("/api/plugins?profile=" + encodeURIComponent(currentProfile));
    plugins = data.plugins;
    renderList();
    const keep = plugins.find((p) => p.id === selectedId);
    if (plugins.length) selectPlugin(keep ? keep.id : plugins[0].id);
    else detailEl.innerHTML = '<div class="empty">' + t("none") + "</div>";
  } catch (e) {
    plugins = [];
    listEl.innerHTML = '<div class="empty">—</div>';
    detailEl.innerHTML = '<div class="empty">' + (e.message || "加载失败") + "</div>";
    toast("加载插件失败: " + (e.message || ""), "err");
  }
}
function clearSearch() {
  const inp = document.getElementById("searchInput");
  inp.value = "";
  renderList();
  inp.focus();
}
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const inp = document.getElementById("searchInput");
  const q = (inp.value || "").toLowerCase();
  const clearBtn = document.getElementById("searchClear");
  if (clearBtn) clearBtn.style.display = q ? "block" : "none";
  const filtered = q ? plugins.filter((p) => (p.id + " " + (p.name || "") + " " + (p.description || "")).toLowerCase().includes(q)) : plugins;
  for (const p of filtered) {
    const row = document.createElement("div");
    row.className = "pl"; row.dataset.id = p.id;
    row.draggable = p.kind === "bundle";
    row.onclick = () => selectPlugin(p.id);
    row.ondragstart = (e) => { e.dataTransfer.setData("text/plain", p.name); row.classList.add("dragging"); };
    row.ondragover = (e) => { if (p.kind === "bundle") { e.preventDefault(); row.classList.add("drag-over"); } };
    row.ondragleave = () => row.classList.remove("drag-over");
    row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drag-over"); reorderBundles(e.dataTransfer.getData("text/plain"), p.name); };
    const st = document.createElement("span"); st.className = "st " + (p.disabled ? "off" : "on");
    const id = document.createElement("span"); id.className = "id"; id.textContent = p.id;
    const note = document.createElement("span"); note.className = "note"; note.textContent = p.disabled ? "⛔" : "";
    const tag = document.createElement("span"); tag.className = "tag" + (updates[p.id] ? " upd" : ""); tag.textContent = updates[p.id] ? "⬆" + updates[p.id].latest : (p.kind === "bundle" ? "b" : "p");
    row.append(st, id, note, tag);
    list.appendChild(row);
  }
  if (!filtered.length) list.innerHTML = '<div class="empty">—</div>';
}
function selectPlugin(id) {
  const p = plugins.find((x) => x.id === id);
  if (!p) return;
  selectedId = id;
  document.querySelectorAll(".pl").forEach((r) => r.classList.toggle("active", r.dataset.id === id));
  const d = document.getElementById("detail");
  d.innerHTML = "";
  const hd = document.createElement("div"); hd.className = "hd";
  const h2 = document.createElement("h2"); h2.textContent = p.id;
  const badge = document.createElement("span"); badge.className = "badge " + (p.disabled ? "off" : "on"); badge.textContent = p.disabled ? t("disabled") : t("enabled");
  hd.append(h2, badge); d.appendChild(hd);
  if (p.description) { const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = p.description; d.appendChild(sub); }
  const grid = document.createElement("div"); grid.className = "row";
  const add = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; grid.append(dt, dd); };
  add(t("source"), p.kind === "bundle" ? "bundle" : "patch");
  add(t("name"), p.name);
  add(t("version"), p.version || "-");
  add(t("status"), p.disabled ? t("disabled") : t("enabled"));
  if (p.has_bundle || p.has_client) add(t("compat"), [p.has_bundle ? "dsh.bundle OK" : null, p.has_client ? "dsh.client OK" : null].filter(Boolean).join("  "));
  if (p.author) add("author", p.author);
  if (p.license) add("license", p.license);
  const cdt = document.createElement("dt"); cdt.textContent = t("config");
  const cdd = document.createElement("dd");
  const ta = document.createElement("textarea"); ta.id = "configEditor"; ta.placeholder = t("configPh"); ta.value = p.config ? JSON.stringify(p.config, null, 2) : "";
  cdd.appendChild(ta); grid.append(cdt, cdd);
  d.appendChild(grid);
  const acts = document.createElement("div"); acts.className = "acts";
  const tg = document.createElement("button"); tg.className = "btn" + (p.disabled ? " primary" : ""); tg.textContent = p.disabled ? t("enable") : t("disable");
  tg.onclick = () => togglePlugin(p.id, !p.disabled);
  const sv = document.createElement("button"); sv.className = "btn"; sv.textContent = t("saveConfig"); sv.onclick = () => saveConfig(p.id);
  acts.append(tg, sv);
  const rd = document.createElement("button"); rd.className = "btn"; rd.textContent = "📖 " + t("readme"); rd.onclick = () => showReadme(p);
  acts.append(rd);
  if (p.kind === "bundle") {
    const gh = document.createElement("button"); gh.className = "btn"; gh.textContent = "GitHub"; gh.onclick = () => openRepo(p.name);
    const rm = document.createElement("button"); rm.className = "btn danger"; rm.textContent = t("removeBundle"); rm.onclick = () => removeBundle(p.name);
    acts.append(gh, rm);
  }
  d.appendChild(acts);
}
async function togglePlugin(id, disabled) {
  await api("/api/toggle", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, id, disabled }) });
  toast((disabled ? "禁用 " : "启用 ") + id, disabled ? "ok" : "ok"); await loadPlugins();
}
async function saveConfig(id) {
  let value; try { value = document.getElementById("configEditor").value.trim() ? JSON.parse(document.getElementById("configEditor").value) : null; } catch { return toast("config 非 JSON", "err"); }
  await api("/api/config", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, id, config: value }) });
  toast(t("saveConfig") + " ✓", "ok"); await loadPlugins();
}
async function removeBundle(name) {
  const ok = await uiConfirm("从 bundles 移除 " + name + "?", { danger: true, okText: t("removeBundle") });
  if (!ok) return;
  await api("/api/bundle", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, name, enabled: false }) });
  await loadPlugins();
}
async function openRepo(name) { const r = await api("/api/open-repo", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, name }) }); if (!r.ok) toast(r.error || "no repo"); }

// Minimal safe README renderer: headings, bold, inline code, fenced code, lists, links, hr.
function renderReadme(text) {
  const nodes = [];
  const lines = text.split(String.fromCharCode(10));
  let i = 0;
  let list = null;
  const flushList = () => { if (list) { nodes.push(list); list = null; } };
  const inline = (t) => {
    let out = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, tx, url) => {
      const safe = /^https?:\/\//.test(url) ? url : '#';
      return '<a href="' + safe + '" target="_blank" rel="noopener">' + tx + '</a>';
    });
    return out;
  };
  while (i < lines.length) {
    const ln = lines[i];
    if (ln.indexOf(String.fromCharCode(96) + String.fromCharCode(96) + String.fromCharCode(96)) === 0) {
      flushList();
      const buf = [];
      i++;
      while (i < lines.length && lines[i].indexOf(String.fromCharCode(96) + String.fromCharCode(96) + String.fromCharCode(96)) !== 0) { buf.push(lines[i]); i++; }
      const pre = document.createElement('pre'); pre.className = 'md-code'; pre.textContent = buf.join(String.fromCharCode(10));
      nodes.push(pre);
    } else if (/^#{1,4}\s/.test(ln)) {
      flushList();
      const level = ln.match(/^#+/)[0].length;
      const h = document.createElement(level <= 2 ? 'h3' : 'h4');
      h.className = 'md-h' + level;
      h.innerHTML = inline(ln.replace(/^#+\s*/, ''));
      nodes.push(h);
    } else if (/^[-*]\s/.test(ln)) {
      if (!list) { list = document.createElement('ul'); list.className = 'md-ul'; }
      const li = document.createElement('li'); li.innerHTML = inline(ln.replace(/^[-*]\s*/, ''));
      list.appendChild(li);
    } else if (/^\s*$/.test(ln)) {
      flushList();
    } else if (/^---+$/.test(ln.trim())) {
      flushList();
      const hr = document.createElement('hr'); hr.className = 'md-hr'; nodes.push(hr);
    } else {
      flushList();
      const p = document.createElement('p'); p.className = 'md-p'; p.innerHTML = inline(ln);
      nodes.push(p);
    }
    i++;
  }
  flushList();
  return { nodes };
}

async function showReadme(p) {
  const r = await api("/api/readme?profile=" + encodeURIComponent(currentProfile) + "&name=" + encodeURIComponent(p.name));
  const mask = document.createElement("div"); mask.className = "modal-mask";
  const modal = document.createElement("div"); modal.className = "modal wide";
  const head = document.createElement("div"); head.className = "mh";
  const title = document.createElement("b"); title.textContent = p.id + " · README";
  const close = document.createElement("button"); close.className = "btn"; close.textContent = "✕";
  close.onclick = () => mask.remove();
  head.append(title, close);
  const body = document.createElement("div"); body.className = "readme";
  if (r.ok) {
    const md = renderReadme(r.readme);
    body.append(...md.nodes);
  } else {
    const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = r.error || "no README";
    body.appendChild(empty);
  }
  if (r.truncated) { const tip = document.createElement("div"); tip.className = "sub"; tip.textContent = "…（截断）"; modal.append(tip); }
  modal.append(head, body);
  mask.append(modal);
  mask.onclick = (e) => { if (e.target === mask) mask.remove(); };
  document.body.appendChild(mask);
}
async function showProfileFiles() {
  if (!currentProfile) return;
  const r = await api("/api/profile-files?profile=" + encodeURIComponent(currentProfile));
  const mask = document.createElement("div"); mask.className = "modal-mask";
  const modal = document.createElement("div"); modal.className = "modal wide";
  const head = document.createElement("div"); head.className = "mh";
  const title = document.createElement("b"); title.textContent = currentProfile + " · package.json / cordis.patch.yml";
  const close = document.createElement("button"); close.className = "btn"; close.textContent = "✕";
  close.onclick = () => mask.remove();
  head.append(title, close);
  modal.append(head);
  const mj = document.createElement("textarea"); mj.className = "file-editor"; mj.spellcheck = false; mj.value = r.manifest || "";
  const pc = document.createElement("textarea"); pc.className = "file-editor"; pc.spellcheck = false; pc.value = r.patch || "";
  const mk = (label, ta) => {
    const lab = document.createElement("div"); lab.className = "sub"; lab.textContent = label;
    modal.append(lab, ta);
  };
  mk("package.json", mj);
  mk("cordis.patch.yml", pc);
  const foot = document.createElement("div"); foot.className = "mh"; foot.style.borderTop = "1px solid var(--line)";
  const tip = document.createElement("span"); tip.style.cssText = "color:var(--muted);font-size:11px;flex:1"; tip.textContent = "保存前自动备份 .bak · 请保持 JSON / YAML 语法正确";
  const save = document.createElement("button"); save.className = "btn primary"; save.textContent = "💾 保存";
  save.onclick = async () => {
    let manifest, patch;
    try { manifest = mj.value.trim() ? JSON.stringify(JSON.parse(mj.value), null, 2) + String.fromCharCode(10) : ""; } catch { return toast("package.json 不是合法 JSON"); }
    patch = pc.value;
    const res = await api("/api/profile-files-save", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, manifest: manifest || null, patch }) });
    if (res.ok) { toast("已保存 ✓（备份在 profile 目录）"); mask.remove(); await loadPlugins(); }
    else toast(res.error || "保存失败");
  };
  foot.append(tip, save);
  modal.append(foot);
  mask.append(modal);
  mask.onclick = (e) => { if (e.target === mask) mask.remove(); };
  document.body.appendChild(mask);
}

async function reorderBundles(from, to) {
  if (!from || !to || from === to) return;
  const names = plugins.filter((p) => p.kind === "bundle").map((p) => p.name);
  const i = names.indexOf(from), j = names.indexOf(to);
  if (i < 0 || j < 0) return;
  names.splice(i, 1); names.splice(j, 0, from);
  await api("/api/reorder", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, bundles: names }) });
  await loadPlugins();
}
async function checkUpdates() {
  toast("检查中…");
  try {
    const list = await api("/api/updates?profile=" + encodeURIComponent(currentProfile));
    updates = {}; for (const u of list) if (u.hasUpdate) updates[u.id] = u;
    renderList(); toast(Object.keys(updates).length ? Object.keys(updates).length + " 个有更新" : "全部最新");
  } catch (e) { toast("检查失败: " + (e.message || ""), "err"); }
}
async function refreshDshStatus() {
  try {
    const portEl = document.getElementById("dshPort");
    const port = portEl ? parseInt(portEl.value, 10) : 3080;
    const s = await api("/api/dsh-status?port=" + (port || 3080));
    dshRunning = s.running;
    renderRail();
  } catch {}
}

async function stopDsh() {
  const ok = await uiConfirm(t("stopConfirm"), { danger: true, okText: t("stopDsh") });
  if (!ok) return;
  const r = await api("/api/dsh-stop", { method: "POST" });
  toast(r.ok ? t("stopDsh") + " ✓" : t("startFailed"), r.ok ? "ok" : "err");
  setTimeout(refreshDshStatus, 1500);
}
async function togglePure() {
  const btn = document.getElementById("pureBtn");
  const purge = btn.dataset.purged !== "1";
  const ask = purge ? t("pureAskOn") : t("pureAskOff");
  const ok = await uiConfirm(ask, { danger: purge, okText: purge ? t("pure") : t("pureOff") });
  if (!ok) return;
  const r = await api("/api/purge", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, purge }) });
  btn.dataset.purged = purge ? "1" : "0";
  btn.classList.toggle("pure-active", purge);
  try { localStorage.setItem("dpm-pure-" + currentProfile, purge ? "1" : "0"); } catch {}
  toast((purge ? "纯净模式：" : "已恢复：") + r.affected + " 个插件" + (purge ? " 已禁用" : " 已启用"), "ok");
  await loadPlugins();
}
async function startDsh() {
  const portEl = document.getElementById("dshPort");
  const port = portEl ? parseInt(portEl.value, 10) : 3080;
  const btn = document.getElementById("startBtn");
  if (btn) { btn.disabled = true; btn.textContent = emojiFor("startBtn") + t("loading"); }
  try {
    const r = await api("/api/dsh-start", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, port: port && port > 0 ? port : null }) });
    toast(r.ok ? "dsh web ✓（" + currentProfile + "，端口 " + (port || 3080) + "）" : t("startFailed"), r.ok ? "ok" : "err");
    setTimeout(refreshDshStatus, 2000);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = emojiFor("startBtn") + t("startDsh"); }
  }
}
function toggleTheme() { document.documentElement.classList.toggle("light"); }
function openSearch() {
  const mask = document.createElement("div"); mask.className = "modal-mask";
  const modal = document.createElement("div"); modal.className = "modal";
  const head = document.createElement("div"); head.className = "mh";
  const input = document.createElement("input"); input.placeholder = "搜索 npm DSH 插件…";
  const go = document.createElement("button"); go.className = "btn primary"; go.textContent = "搜索";
  const close = document.createElement("button"); close.className = "btn"; close.textContent = "✕";
  close.onclick = () => mask.remove();
  head.append(input, go, close);
  const res = document.createElement("div"); res.className = "mr";
  go.onclick = async () => {
    res.innerHTML = '<div class="empty">搜索中…</div>';
    try {
      const list = await api("/api/search?q=" + encodeURIComponent(input.value));
      if (!Array.isArray(list)) { res.innerHTML = '<div class="empty">' + (list.error || "无结果") + "</div>"; return; }
      res.innerHTML = "";
      for (const p of list.slice(0, 30)) {
        const row = document.createElement("div"); row.className = "mi";
        const info = document.createElement("div"); info.className = "info";
        info.innerHTML = "<b>" + (p.name || "") + "</b> <span style='color:var(--dim)'>" + (p.version || "") + "</span><small>" + (p.description || "") + "</small>";
        const btn = document.createElement("button"); btn.className = "btn sm primary"; btn.textContent = "安装";
        btn.onclick = async () => { btn.disabled = true; const r = await api("/api/install", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ profile: currentProfile, package: p.name }) }); toast(r.ok ? "已安装 " + p.name : "安装失败"); if (r.ok) await loadPlugins(); btn.disabled = false; };
        row.append(info, btn); res.appendChild(row);
      }
    } catch (e) { res.innerHTML = '<div class="empty">' + e.message + "</div>"; }
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  modal.append(head, res); mask.appendChild(modal);
  mask.onclick = (e) => { if (e.target === mask) mask.remove(); };
  document.body.appendChild(mask); input.focus();
}
// header quick actions (start/stop dsh kept minimal — dsh is usually managed by the user's own workflow)
document.querySelector(".logo").title = "DSH Plugin Manager";
function applyLabels() {
  const ids = { pureBtn: "pure", startBtn: "startDsh", stopBtn: "stopDsh", installBtn: "installPlugin", profileFilesBtn: "profileFiles" };
  for (const [id, key] of Object.entries(ids)) {
    const el = document.getElementById(id);
    if (el) el.textContent = emojiFor(id) + t(key);
  }
  const lb = document.getElementById("langBtn");
  if (lb) lb.textContent = LANG === "zh" ? "EN" : "中";
}
function applyPureState() {
  const btn = document.getElementById("pureBtn");
  if (!btn || !currentProfile) return;
  let v = "0";
  try { v = localStorage.getItem("dpm-pure-" + currentProfile) || "0"; } catch {}
  btn.dataset.purged = v;
  btn.classList.toggle("pure-active", v === "1");
}
applyLabels();
loadProfiles().then(applyPureState);
refreshDshStatus();
setInterval(refreshDshStatus, 10000);
setInterval(applyPureState, 1000);
</script>
