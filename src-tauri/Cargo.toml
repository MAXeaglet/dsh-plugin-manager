[package]
name = "dsh-plugin-manager"
version = "0.2.3"
description = "Desktop GUI to manage DSH plugins across profiles"
edition = "2021"

[lib]
name = "dsh_plugin_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
